<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="368" viewBox="0 0 1100 368" role="img"><title>JDK faster</title><rect width="100%" height="100%" fill="white"/><g font-family="Arial,sans-serif" fill="#243247" font-size="16"><text x="550" y="30" text-anchor="middle" font-size="22" font-weight="bold">JDK faster — 100,000 elements</text><rect x="325" y="47" width="20" height="15" fill="#0072B2" rx="2"/><text x="353" y="60" >ArrayList (JDK)</text><rect x="550" y="47" width="20" height="15" fill="#D55E00" rx="2"/><text x="578" y="60" >FastArrayList</text><path d="M270 82 V192" stroke="#dce2e8"/><path d="M418 82 V192" stroke="#dce2e8"/><path d="M566 82 V192" stroke="#dce2e8"/><path d="M714 82 V192" stroke="#dce2e8"/><path d="M862 82 V192" stroke="#dce2e8"/><path d="M1010 82 V192" stroke="#dce2e8"/><text x="258" y="107" text-anchor="end">Append: preallocated</text><rect x="270" y="85" width="467.16012631999996" height="18" fill="#0072B2" rx="2"/><text x="744.16012632" y="99" font-size="13">157.824</text><rect x="270" y="107" width="605.5170383200001" height="18" fill="#D55E00" rx="2"/><text x="882.5170383200001" y="121" font-size="13">204.567</text><text x="258" y="162" text-anchor="end">Append: growth</text><rect x="270" y="140" width="555.09038656" height="18" fill="#0072B2" rx="2"/><text x="832.09038656" y="154" font-size="13">187.531</text><rect x="270" y="162" width="714.38037712" height="18" fill="#D55E00" rx="2"/><text x="991.38037712" y="176" font-size="13">241.345</text><text x="270" y="210" text-anchor="middle" font-size="13">0</text><text x="418" y="210" text-anchor="middle" font-size="13">50</text><text x="566" y="210" text-anchor="middle" font-size="13">100</text><text x="714" y="210" text-anchor="middle" font-size="13">150</text><text x="862" y="210" text-anchor="middle" font-size="13">200</text><text x="1010" y="210" text-anchor="middle" font-size="13">250</text><text x="640" y="231" text-anchor="middle" font-size="14">Execution time (µs/op) — lo